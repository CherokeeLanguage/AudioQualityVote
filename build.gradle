plugins {
  id "java-library"
  id "org.gretty"
}

compileJava.options.encoding = 'UTF-8'
compileJava.options.release = 8

compileTestJava.options.encoding = 'UTF-8'
compileTestJava.options.release = 8

gretty {
	servletContainer = 'tomcat9'
}

allprojects {
	repositories {
		mavenCentral()
		maven { url 'https://jitpack.io' }
	}
}

dependencies {
}
