plugins {
  id "java-library"
  id "org.gretty"
}

compileJava.options.encoding = 'UTF-8'
compileJava.options.release = 8

compileTestJava.options.encoding = 'UTF-8'
compileTestJava.options.release = 8

gretty {
	servletContainer = 'tomcat9'
}

allprojects {
	// application version — the single SemVer source of truth (AudioQualityVote#15);
	// explicit wiring: Gradle propagates no root 'version' to subprojects on its own
	version = '0.1.0'
	repositories {
		mavenCentral()
		maven { url 'https://jitpack.io' }
	}
}

dependencies {
}
