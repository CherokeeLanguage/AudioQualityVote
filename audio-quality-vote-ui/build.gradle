plugins {
	id "war"
	id "org.gretty"
	id "org.docstr.gwt"
}

compileJava.options.encoding = 'UTF-8'
compileJava.options.release = 8

compileTestJava.options.encoding = 'UTF-8'
compileTestJava.options.release = 8

// the successor gwt plugin's task classpath omits compileOnly dependencies;
// re-add the compile classpath so compileOnly GWT libs resolve
tasks.withType(org.docstr.gwt.GwtCompileTask).configureEach {
	classpath += sourceSets.main.compileClasspath
}

gretty {
	servletContainer = 'tomcat9'
}

def gwtVersion = '2.10.0'

gwt {
	logLevel = 'INFO'

	maxHeapSize = "2048M"

	gwtVersion = gwtVersion

	modules = ['com.cherokeelessons.audio.quality.AudioQualityVote']

	extraSourceDirs = files(
			"../audio-quality-vote-shared/src/main/resources",
			"../audio-quality-vote-shared/src/main/java",
			"build/generated/sources/annotationProcessor/java/main"
	)

	style = 'PRETTY'
	failOnError = false

	compiler {
		strict = true
		optimize = 0
		incremental = false
		localWorkers = 2
	}

	superDev {
		precompile = false
		bindAddress = "0.0.0.0"
	}
}

war {
	rootSpec.exclude('**/*.class')
	// successor gwt plugin does not wire its compile output into the war (v1 did)
	from tasks.named('gwtCompile').map { it.war }
	// stamp the deployed artifact with its build's version and UTC build date
	// (AudioQualityVote#15); the host page is the client's metadata read surface.
	// Per-line filter — template-engine expansion (expand) mangles this file's
	// document.write content when the whole template is parsed as a Groovy template.
	filesMatching('index.html') {
		filter { String line ->
			line.replace('${aqvVersion}', project.version.toString())
				.replace('${aqvBuildDate}', java.time.LocalDate.now(java.time.ZoneOffset.UTC).toString())
		}
	}
}

// gretty's appStart serves the inplace webapp (build/inplaceWebapp), a separate
// assembly from the war — stamp there too so the local run path (SOP stack) and
// dev mode see the same stamped host page (AudioQualityVote#15 SC-4).
// gretty registers this task in afterEvaluate, so configure it lazily
tasks.matching { it.name == 'prepareInplaceWebAppFolder' }.configureEach {
	filesMatching('index.html') {
		filter { String line ->
			line.replace('${aqvVersion}', project.version.toString())
				.replace('${aqvBuildDate}', java.time.LocalDate.now(java.time.ZoneOffset.UTC).toString())
		}
	}
}

dependencies {
	implementation project(':audio-quality-vote-shared')

	compileOnly 'com.google.gwt:gwt-servlet:'+gwtVersion
	compileOnly 'com.google.gwt:gwt-user:'+gwtVersion

	compileOnly ('javax.inject:javax.inject:1')
	compileOnly ('com.google.dagger:dagger-compiler:2.36')
	compileOnly ('com.google.dagger:dagger-gwt:2.36')
	annotationProcessor ('com.google.dagger:dagger-compiler:2.36')

	compileOnly 'com.ekotrope:gwt-completablefuture:1.0.0'

	compileOnly 'org.fusesource.restygwt:restygwt:2.2.7'
	compileOnly "com.fasterxml.jackson.core:jackson-annotations:2.11.3"
	compileOnly "com.fasterxml.jackson.core:jackson-databind:2.11.3"
	compileOnly 'com.google.code.findbugs:jsr305:3.0.0' //required for restygwt compile
	compileOnly 'com.github.nmorel.gwtjackson:gwt-jackson:0.15.4'
	compileOnly 'javax.xml.bind:jaxb-api:2.3.+'

	compileOnly project(':audio-quality-vote-shared')

	//ui (2.8.5: GWT 2.10-compatible — 2.4.x declares the removed ie10 user.agent)
	compileOnly 'com.github.gwtmaterialdesign:gwt-material:2.8.5'
	compileOnly 'com.github.gwtmaterialdesign:gwt-material-addins:2.8.5'
	compileOnly 'com.github.gwtmaterialdesign:gwt-material-table:2.8.5'
	compileOnly 'com.github.gwtmaterialdesign:gwt-material-themes:2.8.5'
	compileOnly 'com.google.elemental2:elemental2-dom:1.1.+'

	//restapi
	compileOnly 'javax.servlet:javax.servlet-api:3.0.1'
	compileOnly 'javax.ws.rs:javax.ws.rs-api:2.1.1'
}