body: '**Fact (operator directive, 2026-11-09):** `vhost-58.cherokeedictionary.net`
  (104.251.216.58, the delivered Docker serving stack) is now the **prod host**. `vhost-175.cherokeedictionary.net`
  (63.142.255.175 — ced1, the legacy source box, per the DNS fact record''s alias
  entry) is now the **dev host**.


  **Verified anchors (2026-11-09):**

  - vhost-58 serves the production apex (cherokeedictionary.net via the Cloudflare
  edge → the Caddy container) since the devops#14 cutover (closed). Post-deploy verification:
  the regression gate PASSED on the dev tier (10/10) and the apex tier re-ran 10/10
  exit 0 off the same rebuilt origin.

  - vhost-175 → 63.142.255.175 (live resolution; the DNS fact record already carries
  the name as ced1''s alias, as-of 2026-11-02).

  - The dev role is already de-facto: devops#32''s staged replica "on the dev box"
  is that spec''s byte-truth reference.


  **Consequence for this repo:**

  - `SOP.md`''s Deployment section gains the roles: `audio-quality-vote-war/deploy-dict.sh`''s
  vhost-58 target is the prod deployment; dev-stack work lands on vhost-175.


