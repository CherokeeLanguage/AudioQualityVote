plugins {
	id "war"
	id "org.gretty"
}

compileJava.options.encoding = 'UTF-8'
compileJava.options.release = 8

compileTestJava.options.encoding = 'UTF-8'
compileTestJava.options.release = 8

repositories {
	maven { url 'https://jitpack.io' }
}

gretty {
	httpPort = 8080
	servletContainer = 'tomcat9'
	jvmArgs = ['-Dfile.encoding=UTF-8', '-Xmx512M', '-Ddebug=true' ]
	overlay ':audio-quality-vote-server'
	overlay ':audio-quality-vote-ui'
	extraResourceBase '../audio-quality-vote-ui/build/gwt/war'
	contextPath "AudioQualityVote"
}

war {
    archiveFileName = "AudioQualityVote.war"
}